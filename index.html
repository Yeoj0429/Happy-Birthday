<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Adrian!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        body {
            background-color: #e5005c; 
            background-image: radial-gradient(circle, #ff007f, #8a0038);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            touch-action: manipulation; 
        }

        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .card {
            background-color: #fcf5f5;
            border-radius: clamp(20px, 4vw, 40px);
            padding: clamp(30px, 5vw, 60px) clamp(20px, 4vw, 40px);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            width: 90vw;
            max-width: 700px;
            aspect-ratio: 4 / 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            pointer-events: none; 
        }

        .card > * {
            pointer-events: auto;
        }

        .graphics {
            position: relative;
            width: 100%;
            flex-grow: 1;
            min-height: 150px;
            margin-bottom: 2%;
        }

        .svg-art {
            position: absolute;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform-origin: center;
        }

        .pink-stroke { stroke: #d87093; }
        .orange-stroke { stroke: #f3b765; }
        
        .flame {
            fill: #f3b765;
            stroke: none;
            transition: opacity 0.4s ease-out, transform 0.4s;
            transform-origin: bottom center;
            transform-box: fill-box; 
            animation: flicker 0.6s infinite alternate;
        }

        .float-1 { animation: float 4s ease-in-out infinite; }
        .float-2 { animation: float 3.5s ease-in-out infinite 0.5s; }
        .float-3 { animation: float 4.2s ease-in-out infinite 1s; }
        .float-4 { animation: float 3.8s ease-in-out infinite 1.5s; }

        .b1 { width: 12%; left: 5%; top: 40%; }
        .b2 { width: 14%; left: 22%; top: 15%; }
        .cake-svg { width: 35%; left: 50%; bottom: 0; transform: translateX(-50%); }
        .b3 { width: 14%; right: 22%; top: 25%; }
        .b4 { width: 12%; right: 5%; top: 45%; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @keyframes flicker {
            0% { transform: scale(1) skewX(0deg); opacity: 1; }
            100% { transform: scale(1.1) skewX(-3deg); opacity: 0.8; }
        }

        h1 {
            color: #554c50;
            font-size: clamp(32px, 6vw, 55px);
            font-weight: 600;
            margin: 0;
            line-height: 1.1;
        }

        .name {
            color: #d15c8a;
            font-size: clamp(60px, 12vw, 110px);
            font-weight: 700;
            margin: 5px 0;
        }

        .wish{
            margin-bottom: 90px;
            font-size: 32px;
        }

        .text-animate {
            display: inline-block;
            opacity: 0;
            animation: textPopIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 1.5s; }

        @keyframes textPopIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>
    <div class="card">
        <h1 class="wish">
            <span class="text-animate delay-4">Wish ka muna bago mo hipan yung cake :)</span>
        </h1>
        <div class="graphics">
            <svg viewBox="0 0 50 100" class="svg-art pink-stroke float-1 b1">
                <path d="M25 10 C5 10 5 45 25 55 C45 45 45 10 25 10 Z" />
                <path d="M22 55 L28 55 L25 60 Z" />
                <path d="M25 60 Q15 70 25 80 Q35 90 25 100" />
            </svg>
            <svg viewBox="0 0 50 100" class="svg-art pink-stroke float-2 b2">
                <path d="M25 10 C5 10 5 45 25 55 C45 45 45 10 25 10 Z" />
                <path d="M22 55 L28 55 L25 60 Z" />
                <path d="M25 60 Q35 70 25 80 Q15 90 25 100" />
            </svg>

            <svg viewBox="0 0 120 100" class="svg-art pink-stroke cake-svg">
                <rect x="15" y="55" width="90" height="30" rx="4" />
                <path d="M15 55 C25 60, 35 50, 45 55 C55 60, 65 50, 75 55 C85 60, 95 50, 105 55" />
                <rect x="25" y="35" width="70" height="20" rx="3" />
                
                <g stroke-dasharray="2 3">
                    <line x1="35" y1="35" x2="35" y2="15" />
                    <line x1="51" y1="35" x2="51" y2="15" />
                    <line x1="68" y1="35" x2="68" y2="15" />
                    <line x1="84" y1="35" x2="84" y2="15" />
                </g>

                <path class="flame" id="flame1" d="M35 12 C31 8 33 2 35 2 C37 2 39 8 35 12 Z" />
                <path class="flame" id="flame2" d="M51 12 C47 8 49 2 51 2 C53 2 55 8 51 12 Z" />
                <path class="flame" id="flame3" d="M68 12 C64 8 66 2 68 2 C70 2 72 8 68 12 Z" />
                <path class="flame" id="flame4" d="M84 12 C80 8 82 2 84 2 C86 2 88 8 84 12 Z" />
            </svg>

            <svg viewBox="0 0 50 100" class="svg-art orange-stroke float-3 b3">
                <path d="M25 10 C5 10 5 45 25 55 C45 45 45 10 25 10 Z" />
                <path d="M22 55 L28 55 L25 60 Z" />
                <path d="M25 60 Q15 70 25 80 Q35 90 25 100" />
            </svg>
            <svg viewBox="0 0 50 100" class="svg-art pink-stroke float-4 b4">
                <path d="M25 10 C5 10 5 45 25 55 C45 45 45 10 25 10 Z" />
                <path d="M22 55 L28 55 L25 60 Z" />
                <path d="M25 60 Q35 70 25 80 Q15 90 25 100" />
            </svg>
        </div>
        
        <h1>
            <span class="text-animate delay-1">Happy</span><br>
            <span class="text-animate delay-2">Birthday</span><br>
            <span class="name text-animate delay-3">Adrian!</span>
        </h1>
    </div>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];

        class RayParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.originX = x;
                this.originY = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 4; 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.color = Math.random() > 0.5 ? '#f3b765' : '#d87093';
                this.length = Math.random() * 10 + 5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.08;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.alpha -= 0.025;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.moveTo(this.x - this.vx * 1.5, this.y - this.vy * 1.5);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        function spawnFireworks(x, y) {
            for (let i = 0; i < 40; i++) {
                particles.push(new RayParticle(x, y));
            }
        }
        
        window.addEventListener('pointerdown', (e) => {
            spawnFireworks(e.clientX, e.clientY);
            initMic();
        });

        let micInitialized = false;
        
        async function initMic() {
            if (micInitialized) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micInitialized = true;
                
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                
                microphone.connect(analyser);
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                function detectBlow() {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                    }
                    let averageVolume = sum / bufferLength;

                    if (averageVolume > 40) {
                        const flames = document.querySelectorAll('.flame');
                        flames.forEach(flame => {
                            flame.style.opacity = '0';
                            flame.style.animation = 'none';
                            flame.style.transform = 'scale(0)';
                        });
                    }
                    requestAnimationFrame(detectBlow);
                }
                detectBlow();
            } catch (err) {
                console.warn(err);
            }
        }
    </script>
</body>
</html>
